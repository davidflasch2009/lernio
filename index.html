    '<span class="dash-date">' + WD[d.getDay()] + ', ' + d.getDate() + '. ' + MON[d.getMonth()] + ' ' + d.getFullYear() + '</span>' +
  '</div>';

  /* 4 stat cards */
  const dueToday = allHw.filter(x => !x.done && x.due === t0);
  const next = upcoming()[0];
  const daysToTest = next ? diffDays(t0, next.date) : null;
  const openCount = openHw().length;
  const overdue = allHw.filter(x => !x.done && x.due && diffDays(t0, x.due) < 0);

  h += '<div class="dash-stats">' +
    '<div class="dash-stat' + (dueToday.length ? ' alert' : '') + '"><span class="dash-stat-n">' + dueToday.length + '</span><span class="dash-stat-l">HÜs heute</span></div>' +
    '<div class="dash-stat' + (daysToTest !== null && daysToTest <= 3 ? ' warn' : '') + '"><span class="dash-stat-n">' + (daysToTest !== null ? daysToTest : '–') + '</span><span class="dash-stat-l">Tage bis Test</span></div>' +
    '<div class="dash-stat"><span class="dash-stat-n">' + openCount + '</span><span class="dash-stat-l">HÜs offen</span></div>' +
    '<div class="dash-stat' + (overdue.length ? ' alert' : '') + '"><span class="dash-stat-n">' + overdue.length + '</span><span class="dash-stat-l">Überfällig</span></div>' +
  '</div>';

  /* 7-day card grid */
  h += '<div class="sec"><div class="sec-head"><span class="sec-title">Deine Woche</span></div>';
  h += '<div class="dash-week">';
  for (let i = 0; i < 7; i++) {
    const day = addDays(t0, i);
    const dp = parseISO(day);
    const isToday = day === t0;
    const hws = allHw.filter(x => !x.done && x.due === day);
    const exs = upcoming().filter(x => x.date === day);
    const sts = studyTasksOn(day);
    const wks = workTasksOn(day).filter(w => w.hw.due !== day);
    const aps = apptsOn(day);
    const bits = [];
    const dHol = holidayName(day);
    if (dHol) bits.push({ c: 'var(--ok)', t: dHol });
    exs.forEach(e => bits.push({ c: subj(e.subjectId).color, t: (KINDS[e.kind] || KINDS.test).label + ' ' + subj(e.subjectId).short }));
    hws.forEach(x => bits.push({ c: subj(x.subjectId).color, t: 'HÜ ' + subj(x.subjectId).short }));
    wks.forEach(w => bits.push({ c: subj(w.hw.subjectId).color, t: subj(w.hw.subjectId).short }));
    sts.forEach(() => bits.push({ c: 'var(--ink-3)', t: 'Lernen' }));
    aps.forEach(a => bits.push({ c: (APPT_KINDS[a.kind] || APPT_KINDS.privat).color, t: a.title }));

    h += '<div class="dash-day' + (isToday ? ' is-today' : '') + (dHol ? ' is-holiday' : '') + '" data-act="cal-jump" data-date="' + day + '" role="button" tabindex="0">' +
      '<div class="dash-day-head"><span>' + WDS[dp.getDay()] + '</span><span class="dash-day-num">' + dp.getDate() + '</span></div>' +
      '<div class="dash-day-items">';
    if (bits.length) {
      bits.slice(0, 4).forEach(b => {
        h += '<div class="dash-day-chip"><span class="dash-day-dot" style="background:' + esc(b.c) + '"></span>' + esc(b.t) + '</div>';
      });
      if (bits.length > 4) h += '<div class="dash-day-chip" style="color:var(--ink-4)">+' + (bits.length - 4) + ' mehr</div>';
    } else {
      h += '<div class="dash-day-empty">frei</div>';
    }
    h += '</div></div>';
  }
  h += '</div></div>';

  return h;
}

function viewHeute() {
  const t0 = today();
  const d = parseISO(t0);
  const allHw = hwSorted();
  const overdue = allHw.filter(h => !h.done && h.due && diffDays(t0, h.due) < 0);
  const dueToday = allHw.filter(h => !h.done && h.due === t0);
  const study = studyTasksOn(t0);
  const studyOpen = study.filter(t => !t.done);
  const work = workTasksOn(t0).filter(w => w.hw.due !== t0);   // due today is already listed above
  const workOpen = work.filter(w => !w.done);
  const next = upcoming()[0];
  const soon = allHw.filter(h => !h.done && h.due && diffDays(t0, h.due) >= 1 && diffDays(t0, h.due) <= 7);
  const nothing = !overdue.length && !dueToday.length && !study.length && !work.length;

  let h = '<div class="today-hero">' +
    '<div class="today-date">' +
      '<span class="today-daynum">' + d.getDate() + '</span>' +
      '<span class="today-dayinfo">' +
        '<span class="today-weekday">' + WD[d.getDay()] + '</span>' +
        '<span class="today-month num">' + MON[d.getMonth()] + ' ' + d.getFullYear() + '</span>' +
      '</span>' +
    '</div>' +
    '<div class="today-stats">' +
      '<div class="tstat' + (dueToday.length ? ' alert' : '') + '"><span class="tstat-n">' + dueToday.length + '</span><span class="tstat-l">heute fällig</span></div>' +
      '<div class="tstat' + (studyOpen.length + workOpen.length ? ' warn' : '') + '"><span class="tstat-n">' +
        (studyOpen.length + workOpen.length) + '</span><span class="tstat-l">einheiten</span></div>' +
      '<div class="tstat"><span class="tstat-n">' + openHw().length + '</span><span class="tstat-l">HÜs offen</span></div>' +
      '<div class="tstat"><span class="tstat-n">' + (next ? diffDays(t0, next.date) : '–') + '</span><span class="tstat-l">tage bis test</span></div>' +
    '</div></div>';

  const todayHol = holidayName(t0);
  if (todayHol) {
    const todayHInfo = holidayInfo(t0);
    h += '<div class="banner" style="background:var(--ok-soft);color:var(--ok)">' + I.info +
      '<span><strong>' + esc(todayHol) + '</strong> — ' +
      (todayHInfo.type === 'feiertag' ? 'gesetzlicher Feiertag' : 'schulfrei') +
      '. Nutze den Tag zum Lernen oder Erholen!</span></div>';
  }

  if (overdue.length) {
    h += '<div class="banner banner-alert">' + I.alert +
      '<span><strong>' + overdue.length + (overdue.length === 1 ? ' Hausübung ist' : ' Hausübungen sind') +
      ' überfällig.</strong> Unten in der Liste.</span></div>';
  }

  /* days that slipped by without being ticked off */
  const missed = missedUnits();
  if (missed.length) {
    h += '<div class="sec"><div class="sec-head"><span class="sec-title">Nachholen</span>' +
      '<span class="sec-count">' + missed.length + '</span></div>' +
      '<div class="banner banner-alert" style="margin:0 0 9px">' + I.alert +
        '<span>' + (missed.length === 1 ? 'Eine Einheit ist' : missed.length + ' Einheiten sind') +
        ' liegen geblieben. Abhaken, wenn du sie doch gemacht hast — sonst häng sie an einen freien Tag.</span></div>' +
      '<div class="list">' +
        missed.slice(0, 6).map(m => m.type === 'study' ? studyCard(m) : workCard(m)).join('') +
      '</div></div>';
  }

  if (nothing) {
    h += '<div class="sec">' + emptyBox('Heute ist nichts offen.',
      soon.length ? 'Als Nächstes: ' + esc(soon[0].title) + ' am ' + fmtShort(soon[0].due) + '.'
                  : 'Kein Termin in den nächsten Tagen.') + '</div>';
  }

  if (dueToday.length) {
    h += '<div class="sec"><div class="sec-head"><span class="sec-title">Heute abgeben</span>' +
      '<span class="sec-count">' + dueToday.length + '</span></div>' +
      '<div class="list">' + dueToday.map(hwItem).join('') + '</div></div>';
  }

  if (work.length) {
    h += '<div class="sec"><div class="sec-head"><span class="sec-title">Heute dran</span>' +
      '<span class="sec-count">' + workOpen.length + ' / ' + work.length + '</span></div>' +
      '<div class="list">' + work.map(workCard).join('') + '</div></div>';
  }

  if (study.length) {
    h += '<div class="sec"><div class="sec-head"><span class="sec-title">Heute lernen</span>' +
      '<span class="sec-count">' + studyOpen.length + ' / ' + study.length + '</span></div>' +
      '<div class="list">' + study.map(studyCard).join('') + '</div></div>';
  }

  if (overdue.length) {
    h += '<div class="sec"><div class="sec-head"><span class="sec-title">Überfällig</span>' +
      '<span class="sec-count">' + overdue.length + '</span></div>' +
      '<div class="list">' + overdue.map(hwItem).join('') + '</div></div>';
  }

  const nextWeek = [];
  for (let i = 1; i <= 7; i++) {
    const day = addDays(t0, i);
    const hws = allHw.filter(x => !x.done && x.due === day);
    const sts = studyTasksOn(day);
    const wks = workTasksOn(day).filter(w => w.hw.due !== day);
    const exs = upcoming().filter(x => x.date === day);
    const aps = apptsOn(day);
    nextWeek.push({ day, hws, sts, wks, exs, aps, load: dayLoad(day), cap: dayCapacity(day) });
  }
  h += '<div class="sec"><div class="sec-head"><span class="sec-title">Die nächsten 7 Tage</span>' +
    '<span class="sec-action"><button class="btn btn-sm btn-ghost" type="button" data-act="go-load">' +
    I.grid + 'Auslastung</button></span></div><div class="list">';
  nextWeek.forEach(g => {
    const bits = [];
    const dayHol = holidayName(g.day);
    if (dayHol) bits.push({ c: 'var(--ok)', t: dayHol });
    g.exs.forEach(e => bits.push({ c: subj(e.subjectId).color, t: (KINDS[e.kind] || KINDS.test).label + ' ' + subj(e.subjectId).short }));
    g.hws.forEach(x => bits.push({ c: subj(x.subjectId).color, t: 'HÜ ' + subj(x.subjectId).short }));
    g.wks.forEach(w => bits.push({ c: subj(w.hw.subjectId).color, t: 'arbeiten ' + subj(w.hw.subjectId).short }));
    if (g.sts.length) bits.push({ c: 'var(--ink-3)', t: g.sts.length + '× lernen' });
    g.aps.forEach(a => bits.push({ c: (APPT_KINDS[a.kind] || APPT_KINDS.privat).color, t: a.title }));
    h += '<div class="item" style="--sc:var(--line-2)"><div class="item-body" data-act="cal-jump" data-date="' + g.day + '" role="button" tabindex="0">' +
      '<div class="item-top" style="justify-content:space-between">' +
        '<span class="item-title" style="font-size:13.5px">' + esc(fmtLong(g.day)) + '</span>' +
        '<span style="display:inline-flex;align-items:center;gap:8px">' +
          '<span class="sec-count num">' + fmtUnits(g.load) + '/' + fmtUnits(g.cap) + '</span>' +
          loadMeter(g.load, g.cap, true) + '</span></div>' +
      (bits.length
        ? '<div class="item-meta" style="gap:6px">' + bits.map(b =>
            '<span class="chip"><span class="chip-dot" style="background:' + esc(b.c) + '"></span>' + esc(b.t) + '</span>').join('') + '</div>'
        : '<div class="item-meta"><span>nichts eingetragen</span></div>') +
      '</div></div>';
  });
  h += '</div></div>';
  return h;
}

/* ============================================================
   11. VIEW — KALENDER
   ============================================================ */
function eventsOn(date) {
  const out = [];
  examsSorted().forEach(e => {
    if (e.date === date) {
      const s = subj(e.subjectId);
      out.push({ type: 'exam', color: s.color, label: (KINDS[e.kind] || KINDS.test).label + ' ' + (s.short || s.name), item: e });
    }
  });
  hwSorted().forEach(x => {
    if (x.due === date) {
      const s = subj(x.subjectId);
      out.push({ type: 'hw', color: s.color, label: 'HÜ ' + (s.short || s.name), item: x, done: x.done });
    }
  });
  workTasksOn(date).forEach(t => {
    if (t.hw.due === date) return;                  // the deadline row already covers it
    const s = subj(t.hw.subjectId);
    out.push({ type: 'work', color: s.color, label: 'Arbeiten ' + (s.short || s.name), item: t, done: t.done });
  });
  studyTasksOn(date).forEach(t => {
    const s = subj(t.exam.subjectId);
    out.push({ type: 'study', color: s.color, label: 'Lernen ' + (s.short || s.name), item: t, done: t.done });
  });
  apptsOn(date).forEach(a => {
    out.push({ type: 'appt', color: (APPT_KINDS[a.kind] || APPT_KINDS.privat).color, label: a.title, item: a });
  });
  /* Feiertage & Schulferien als eigenes Event (am Anfang einfügen) */
  const hName = holidayName(date);
  if (hName) {
    const hInfo = holidayInfo(date);
    out.unshift({ type: 'holiday', color: 'var(--ok)', label: hName,
      item: { name: hName, type: hInfo.type } });
  }
  return out;
}

function monthCells(ym) {
  const p = ym.split('-'); const y = +p[0], m = +p[1];
  const first = new Date(y, m - 1, 1);
  const offset = (first.getDay() + 6) % 7;
  const start = new Date(y, m - 1, 1 - offset);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    cells.push(isoOf(d));
  }
  if (cells.slice(35).every(c => +c.slice(5, 7) !== m)) cells.length = 35;
  return cells;
}

function viewKalender() {
  const ym = State.calMonth;
  const p = ym.split('-'); const y = +p[0], m = +p[1];
  const cells = monthCells(ym);
  const t0 = today();

  const loadMode = State.calMode === 'load';

  let h = '<div class="page-head"><div class="page-eyebrow">Übersicht</div>' +
    '<h1 class="page-title">Kalender</h1>' +
    '<p class="page-sub">' + (loadMode
      ? 'Wie voll jeder Tag ist. Die hellen Tage sind die, an denen noch Platz für eine Hausübung ist.'
      : 'Gefüllt sind Abgaben und Tests, umrandet die Lern- und Arbeitstage. Farbe ist das Fach.') +
    '</p></div>';

  h += '<div class="cal-head">' +
    '<span class="cal-month">' + MON[m - 1] + ' <span class="num">' + y + '</span></span>' +
    '<div class="cal-nav">' +
      '<span class="seg seg-sm" style="margin-right:6px">' +
        '<button type="button" data-act="cal-mode" data-m="events"' + (loadMode ? '' : ' aria-pressed="true"') + '>Termine</button>' +
        '<button type="button" data-act="cal-mode" data-m="load"' + (loadMode ? ' aria-pressed="true"' : '') + '>Auslastung</button>' +
      '</span>' +
      '<button class="btn btn-sm" type="button" data-act="cal-today">Heute</button>' +
      '<button class="icon-btn" type="button" data-act="cal-prev" aria-label="Voriger Monat">' + I.chevL + '</button>' +
      '<button class="icon-btn" type="button" data-act="cal-next" aria-label="Nächster Monat">' + I.chevR + '</button>' +
    '</div></div>';

  h += '<div class="cal-grid">' + ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So']
    .map(w => '<div class="cal-wd">' + w + '</div>').join('');

  cells.forEach(c => {
    const inMonth = +c.slice(5, 7) === m;
    const wd = parseISO(c).getDay();
    const evs = eventsOn(c);
    const load = dayLoad(c);
    const cap = dayCapacity(c);
    const st = loadStep(load <= 0 ? 0 : load / cap);
    const cls = ['cal-day'];
    if (!inMonth) cls.push('is-out');
    if (c === t0) cls.push('is-today');
    if (c === State.calSel) cls.push('is-sel');
    if ((wd === 0 || wd === 6) && !loadMode) cls.push('is-weekend');   // would out-specify lm-*
    if (isSchoolFree(c) && !loadMode) cls.push('is-holiday');
    if (loadMode && inMonth && diffDays(t0, c) >= 0) cls.push('lm-' + st.key);
    const shown = evs.slice(0, 3);
    const hol = holidayName(c);
    h += '<button class="' + cls.join(' ') + '" type="button" data-act="cal-pick" data-date="' + c + '" ' +
      'aria-label="' + esc(fmtLong(c)) + (hol ? ', ' + esc(hol) : '') + ', ' + esc(st.label) + (evs.length ? ', ' + evs.length + ' Einträge' : '') + '">' +
      '<span class="cal-daynum">' + parseISO(c).getDate() + '</span>' +
      (loadMode
        ? (inMonth && diffDays(t0, c) >= 0
            ? '<span class="cal-load-n">' + (load ? fmtUnits(load) : '–') +
              '<small>/' + fmtUnits(cap) + '</small></span>' : '')
        : shown.map(e => '<span class="cal-ev' + (e.type === 'study' || e.type === 'work' ? ' ev-study' : '') +
            (e.type === 'appt' ? ' ev-appt' : '') + (e.type === 'holiday' ? ' ev-holiday' : '') +
            (e.done ? ' ev-done' : '') +
            '" style="--ec:' + esc(e.color) + '">' + esc(e.label) + '</span>').join('') +
          (evs.length > 3 ? '<span class="cal-more">+' + (evs.length - 3) + '</span>' : '') +
          '<span class="cal-dots">' + evs.slice(0, 6).map(e =>
            '<span class="cal-dot' + (e.type === 'study' || e.type === 'work' ? ' dot-study' : '') +
            (e.type === 'appt' ? ' dot-appt' : '') +
            '" style="--ec:' + esc(e.color) + '"></span>').join('') + '</span>' +
          (st.key !== 'free' ? '<span class="cal-strip lm-' + st.key + '"></span>' : '')) +
      '</button>';
  });
  h += '</div>';

  h += '<div class="cal-legend">' + (loadMode
    ? '<span><span class="lg-sq" style="background:color-mix(in srgb,var(--ok) 55%,var(--surface))"></span>wenig</span>' +
      '<span><span class="lg-sq" style="background:color-mix(in srgb,var(--warn) 65%,var(--surface))"></span>gut gefüllt</span>' +
      '<span><span class="lg-sq" style="background:color-mix(in srgb,var(--danger) 65%,var(--surface))"></span>voll</span>' +
      '<span>geplant / möglich — eine Einheit sind ' + UNIT_MIN + ' Minuten</span>'
    : '<span><span class="lg-sq" style="background:var(--accent)"></span>Abgabe / Test</span>' +
      '<span><span class="lg-sq hollow" style="border-color:var(--accent)"></span>Lern- &amp; Arbeitstag</span>' +
      '<span><span class="lg-sq" style="background:var(--ink-3);opacity:.45"></span>Termin</span>' +
      '<span><span class="lg-sq" style="background:color-mix(in srgb,var(--ok) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)"></span>Feiertag / Ferien</span>' +
      '<span>Farbe = Fach</span>') + '</div>';

  /* selected-day panel */
  const sel = State.calSel;
  const evs = eventsOn(sel);
  const selLoad = dayLoad(sel), selCap = dayCapacity(sel);
  const selAppts = apptsOn(sel);
  h += '<div class="day-panel"><div class="day-panel-head">' +
    '<span class="day-panel-date">' + esc(fmtLong(sel)) + '</span>' +
    '<span class="sec-count">' + (sel === t0 ? 'heute' : relDay(sel)) + '</span>' +
    loadMeter(selLoad, selCap, true) +
    '<span class="sec-count num">' + fmtUnits(selLoad) + ' / ' + fmtUnits(selCap) + '</span>' +
    '<span class="sec-action"><button class="btn btn-sm" type="button" data-act="new-hw" data-date="' + sel + '">' +
      I.plus + 'HÜ hier</button></span></div>';

  const selHoliday = holidayName(sel);
  if (selHoliday) {
    const selHInfo = holidayInfo(sel);
    h += '<div class="banner" style="margin-top:0;margin-bottom:12px;background:var(--ok-soft);color:var(--ok)">' + I.info +
      '<span><strong>' + esc(selHoliday) + '</strong> — ' +
      (selHInfo.type === 'feiertag' ? 'gesetzlicher Feiertag' : 'schulfrei') +
      '. Der ganze Tag steht zum Lernen oder Erholen zur Verfügung.</span></div>';
  }
  const hasExam = evs.some(e => e.type === 'exam');
  if (hasExam) {
    h += '<div class="banner banner-info" style="margin-top:0;margin-bottom:12px">' + I.info +
      '<span>Der Test ist am Vormittag — der Nachmittag zählt als frei und lässt sich für anderes verplanen.</span></div>';
  }

  if (!evs.length) {
    h += emptyBox('Nichts an diesem Tag.',
      diffDays(t0, sel) >= 0 ? 'Platz für ' + fmtUnits(selCap) + ' Einheiten.' : 'War frei.');
  } else {
    h += '<div class="list">';
    evs.forEach(e => {
      if (e.type === 'hw') h += hwItem(e.item);
      else if (e.type === 'exam') h += examRowCompact(e.item);
      else if (e.type === 'work') h += workCard(e.item);
      else if (e.type === 'study') h += studyCard(e.item);
    });
    h += '</div>';
  }
  if (selAppts.length) {
    h += '<div class="sec"><div class="sec-head"><span class="sec-title">Fix an dem Tag</span></div><div class="list">' +
      selAppts.map(apptRow).join('') + '</div></div>';
  }
  h += '</div>';
  return h;
}

function apptRow(a) {
  const k = APPT_KINDS[a.kind] || APPT_KINDS.privat;
  const cost = apptCost(a);
  return '<div class="item" style="--sc:' + esc(k.color) + '">' +
    '<div class="item-body" data-act="appt-edit" data-id="' + esc(a.id) + '" role="button" tabindex="0">' +
      '<div class="item-top"><span class="item-subject">' + esc(k.label) + '</span>' +
        (a.repeat === 'weekly'
          ? '<span class="chip">jede Woche</span>'
          : '<span class="chip">einmalig</span>') + '</div>' +
      '<div class="item-title">' + esc(a.title) + '</div>' +
      '<div class="item-meta">' +
        (a.from && a.to ? '<span class="num">' + esc(a.from) + '–' + esc(a.to) + '</span>' : '<span>ganzer Tag</span>') +
        (a.repeat === 'weekly' ? '<span>' + (a.weekdays || []).map(w => WDS[w]).join(', ') + '</span>' : '') +
        (cost ? '<span>kostet ' + fmtUnits(cost) + ' Einheiten</span>' : '<span>macht den Tag frei</span>') +
      '</div></div>' +
    '<div class="item-actions">' +
      '<button class="icon-btn" type="button" data-act="appt-edit" data-id="' + esc(a.id) + '" aria-label="Bearbeiten">' + I.pencil + '</button>' +
      '<button class="icon-btn" type="button" data-act="appt-del" data-id="' + esc(a.id) + '" aria-label="Löschen">' + I.trash + '</button>' +
    '</div></div>';
}

/* ============================================================
   12. VIEW — HAUSÜBUNGEN
   ============================================================ */
function viewHue() {
  const t0 = today();
  const all = hwSorted();
  const f = State.hwFilter;
  let list = f === 'open' ? all.filter(h => !h.done)
           : f === 'done' ? all.filter(h => h.done) : all;

  let h = '<div class="page-head"><div class="page-eyebrow">Hausübungen</div>' +
    '<h1 class="page-title">HÜs</h1>' +
    '<p class="page-sub">Alles, was abzugeben ist — sortiert nach Fälligkeit.</p></div>';

  h += '<div class="quick" style="margin-bottom:9px">' +
    [['open', 'Offen', all.filter(x => !x.done).length],
     ['all', 'Alle', all.length],
     ['done', 'Erledigt', all.filter(x => x.done).length]].map(o =>
      '<button class="quick-btn" type="button" data-act="hw-filter" data-f="' + o[0] + '"' +
      (f === o[0] ? ' aria-pressed="true"' : '') + '>' + o[1] + ' <span class="num">' + o[2] + '</span></button>').join('') +
    '</div>';

  const subs = subjectsSorted();
  if (subs.length > 1) {
    h += '<div class="quick" style="margin-bottom:18px">' +
      '<button class="quick-btn" type="button" data-act="hw-subj" data-s=""' +
        (State.hwSubj ? '' : ' aria-pressed="true"') + '>Alle Fächer</button>' +
      subs.filter(s => all.some(x => x.subjectId === s.id)).map(s =>
        '<button class="quick-btn" type="button" data-act="hw-subj" data-s="' + esc(s.id) + '"' +
        (State.hwSubj === s.id ? ' aria-pressed="true"' : '') + '>' +
        '<span class="chip-dot" style="background:' + esc(s.color) + ';display:inline-block;margin-right:5px"></span>' +
        esc(s.short || s.name) + '</button>').join('') +
      '</div>';
  }
  if (State.hwSubj) list = list.filter(x => x.subjectId === State.hwSubj);

  if (!list.length) {
    h += emptyBox(f === 'done' ? 'Noch nichts abgehakt.' : 'Keine offenen Hausübungen.',
      f === 'done' ? '' : 'Mit dem Plus-Knopf eine eintragen.');
    return h;
  }

  const groups = [
    ['Überfällig', list.filter(x => !x.done && x.due && diffDays(t0, x.due) < 0)],
    ['Heute', list.filter(x => !x.done && x.due === t0)],
    ['Morgen', list.filter(x => !x.done && x.due === addDays(t0, 1))],
    ['Diese Woche', list.filter(x => !x.done && x.due && diffDays(t0, x.due) >= 2 && diffDays(t0, x.due) <= 7)],
    ['Später', list.filter(x => !x.done && x.due && diffDays(t0, x.due) > 7)],
    ['Ohne Datum', list.filter(x => !x.done && !x.due)],
    ['Erledigt', list.filter(x => x.done)],
  ];
  groups.forEach(g => {
    if (!g[1].length) return;
    h += '<div class="sec"><div class="sec-head"><span class="sec-title">' + esc(g[0]) + '</span>' +
      '<span class="sec-count">' + g[1].length + '</span></div>' +
      '<div class="list">' + g[1].map(hwItem).join('') + '</div></div>';
  });
  return h;
}

function examCard(e) {
  const s = subj(e.subjectId);
  const k = KINDS[e.kind] || KINDS.test;
  const t0 = today();
  const n = diffDays(t0, e.date);
  const plan = studyPlan(e);
  const prog = studyProgress(e);
  const open = !!State.openExams[e.id];
  const isPast = n < 0;
  const done = e.studyDone || {};

  let h = '<div class="exam" style="--sc:' + esc(s.color) + '"><div class="exam-head">' +
    '<div class="exam-main" style="cursor:pointer" data-act="ex-detail" data-id="' + esc(e.id) + '" role="button" tabindex="0">' +
      '<div class="exam-top"><span class="item-subject">' + esc(s.short || s.name) + '</span>' +
        '<span class="chip">' + esc(k.label) + '</span>' +
        (isPast ? '' : urgPill(urgency(e.date, false))) + '</div>' +
      '<div class="exam-title">' + esc(e.title) + '</div>' +
      '<div class="exam-when"><span class="num">' + esc(fmtLong(e.date)) + '</span>' +
        (plan.length && !isPast ? '<span>·</span><span>Lernen ab <b class="num">' + esc(fmtShort(plan[0].date)) + '</b></span>' : '') +
      '</div>' +
      (plan.length && !isPast
        ? '<div class="bar" aria-label="Lernfortschritt ' + prog.pct + ' Prozent"><div class="bar-fill" style="width:' + prog.pct + '%"></div></div>'
        : '') +
    '</div>' +
    '<div class="exam-count">' +
      (isPast
        ? (e.grade ? '<span class="exam-grade" data-g="' + esc(e.grade) + '">' + esc(e.grade) + '</span>'
                   : '<button class="btn btn-sm" type="button" data-act="ex-grade" data-id="' + esc(e.id) + '">Note</button>')
        : '<span class="exam-count-n">' + n + '</span><span class="exam-count-l">' + (n === 1 ? 'Tag' : 'Tage') + '</span>') +
    '</div></div>';

  /* body: topics + study plan */
  const topics = (e.topics || []).filter(t => t && t.label);
  if (topics.length || plan.length || e.notes) {
    h += '<div class="exam-body">';
    if (topics.length) {
      h += '<div class="sec-head" style="margin-bottom:7px"><span class="sec-title">Stoff</span>' +
        '<span class="sec-count">' + topics.filter(t => t.done).length + ' / ' + topics.length + '</span></div>' +
        '<div class="topic-list">' + topics.map((t, i) => {
          const w = weightOf(t);
          return '<button class="topic-tag" type="button" data-act="topic-toggle" data-id="' + esc(e.id) + '" data-i="' + i + '"' +
            (t.done ? ' aria-pressed="true"' : '') + '>' + (t.done ? I.check : '') + esc(t.label) +
            (w !== 2 ? '<span style="opacity:.6;font-size:11px">' + esc(WEIGHTS[w].label) + '</span>' : '') + '</button>';
        }).join('') + '</div>';
    }
    if (plan.length && !isPast) {
      h += '<div class="sec-head" style="margin-top:15px;margin-bottom:3px">' +
        '<span class="sec-title">Lernplan</span>' +
        '<span class="sec-count">' + prog.done + ' / ' + prog.total + ' Tage</span>' +
        (plan.length > 4
          ? '<span class="sec-action"><button class="btn btn-sm btn-ghost" type="button" data-act="ex-expand" data-id="' + esc(e.id) + '">' +
            (open ? 'Einklappen' : 'Ganz aufklappen') + '</button></span>'
          : '') + '</div>' +
        '<div class="plan' + (!open && plan.length > 4 ? ' is-scroll' : '') + '">';
      const visible = plan;
      if (!visible.length) h += '<div class="plan-row"><span class="plan-topics" style="color:var(--ink-3)">Lernphase läuft noch nicht.</span></div>';
      visible.forEach(p => {
        const isDone = !!done[p.date];
        const cls = ['plan-row'];
        if (p.date === t0) cls.push('is-today');
        if (isDone) cls.push('is-done');
        if (diffDays(t0, p.date) < 0) cls.push('is-past');
        const what = p.entries.length ? esc(entryText(p.entries))
                                      : '<i>' + esc(planLabel[p.kind]) + '</i>';
        h += '<div class="' + cls.join(' ') + '">' +
          '<button class="plan-check" type="button" data-act="study-toggle" data-id="' + esc(e.id) + '" data-date="' + esc(p.date) + '"' +
            ' aria-pressed="' + (isDone ? 'true' : 'false') + '" aria-label="Lerntag erledigt">' + I.check + '</button>' +
          '<span class="plan-date">' + esc(fmtShort(p.date)) + '</span>' +
          '<span class="plan-topics">' + what + '</span></div>';
      });
      h += '</div>';
    }
    if (e.notes) h += '<div class="item-notes" style="margin-top:12px">' + esc(e.notes) + '</div>';
    h += '<div style="display:flex;gap:6px;margin-top:13px">' +
      '<button class="btn btn-sm" type="button" data-act="ex-edit" data-id="' + esc(e.id) + '">' + I.pencil + 'Bearbeiten</button>' +
      '<button class="btn btn-sm btn-danger" type="button" data-act="ex-del" data-id="' + esc(e.id) + '">' + I.trash + 'Löschen</button>' +
      '</div></div>';
  } else {
    h += '<div class="exam-body"><div style="display:flex;gap:6px">' +
      '<button class="btn btn-sm" type="button" data-act="ex-edit" data-id="' + esc(e.id) + '">' + I.pencil + 'Stoff eintragen</button>' +
      '<button class="btn btn-sm btn-danger" type="button" data-act="ex-del" data-id="' + esc(e.id) + '">' + I.trash + 'Löschen</button>' +
      '</div></div>';
  }
  return h + '</div>';
}

/* cheap counts for the settings screen — the full .ics is only built on export */
function exportCounts() {
  const t0 = today();
  let nStudy = 0, nWork = 0;
  const up = upcoming();
  up.forEach(e => studyPlan(e).forEach(p => { if (diffDays(t0, p.date) >= 0) nStudy++; }));
  const hw = hwSorted().filter(h => !h.done && h.due && diffDays(t0, h.due) >= 0);
  hw.forEach(h => workPlan(h).forEach(p => { if (diffDays(t0, p.date) >= 0 && p.date !== h.due) nWork++; }));
  return { nHw: hw.length, nEx: up.length, nStudy: nStudy, nWork: nWork };
}

let keepScroll = false;
function render() {
  renderNav();
  const v = $('#view'), sc = $('#scroll');
  const y = sc ? sc.scrollTop : 0;

  if (!Store.ready) {
    v.innerHTML = '<div class="skel" style="height:96px;margin-bottom:22px"></div>' +
      '<div class="skel" style="height:54px;margin-bottom:9px"></div>' +
      '<div class="skel" style="height:54px;margin-bottom:9px;opacity:.7"></div>' +
      '<div class="skel" style="height:54px;opacity:.4"></div>';
    return;
  }
  if (!subjectsSorted().length && State.view !== 'mehr' && State.view !== 'uebersicht') { v.innerHTML = viewOnboarding(); if (sc) sc.scrollTop = 0; return; }

  v.innerHTML = State.view === 'uebersicht' ? viewUebersicht()
              : State.view === 'kalender' ? viewKalender()
              : State.view === 'hue'      ? viewHue()
              : State.view === 'tests'    ? viewTests()
              : State.view === 'mehr'     ? viewMehr()
              : viewHeute();
  if (sc) sc.scrollTop = keepScroll ? y : 0;
  keepScroll = false;
  updateFab();
  /* a scrolling plan opens on today, not on days already behind */
  document.querySelectorAll('.plan.is-scroll').forEach(p => {
    const row = p.querySelector('.plan-row.is-today') || p.querySelector('.plan-row:not(.is-past)');
    if (row) p.scrollTop = Math.max(0, row.offsetTop - p.offsetTop - 6);
  });
}
function rerender() { keepScroll = true; render(); }

const isTouch = () => window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

function openModal(inner, label, mount, sheet, sheetId) {
  /* the backdrop deliberately carries NO data-act: it would swallow every
     click that bubbles up from a field inside the dialog and close it. */
  $('#modal-root').innerHTML =
    '<div class="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(label) + '"' +
    (sheet ? ' data-sheet="' + esc(sheet) + '" data-sheet-id="' + esc(sheetId || '') + '"' : '') + '>' +
    inner + '</div></div>';
  if (mount) mount();
  if (!isTouch()) {
    const f = $('#modal-root').querySelector('input:not([type=hidden]):not([type=range]), textarea, select');
    if (f) setTimeout(() => { try { f.focus(); } catch (e) {} }, 50);
  }
}
function closeModal() { $('#modal-root').innerHTML = ''; }

/* a detail sheet redraws itself after a tick, keeping its scroll position */
function refreshSheet() {
  const m = $('#modal-root [data-sheet]');
  if (!m) return;
  const body = m.querySelector('.modal-body');
  const y = body ? body.scrollTop : 0;
  const kind = m.dataset.sheet, sid = m.dataset.sheetId;
  if (kind === 'hw') modalHwDetail(sid);
  else if (kind === 'ex') modalExamDetail(sid);
  const nb = $('#modal-root .modal-body');
  if (nb) nb.scrollTop = y;
}

/* --- the day picker used by the homework form ------------------- */
function dayPickerHTML(due, selected, excludeId) {
  const t0 = today();
  if (!due) return '<div class="lead-preview">Zuerst ein Abgabedatum wählen.</div>';
  const last = addDays(due, -1);
  if (diffDays(t0, last) < 0)
    return '<div class="lead-preview">Abgabe ist heute oder schon vorbei — da bleibt nichts mehr aufzuteilen.</div>';
  const map = loadMap(excludeId);
  let out = '<div class="dayline">';
  let n = 0;
  for (let d = t0; diffDays(d, last) >= 0 && n < 21; d = addDays(d, 1), n++) {
    const wd = parseISO(d).getDay();
    const load = map[d] || 0;
    const on = selected.indexOf(d) >= 0;
    out += '<button class="dayopt' + ((wd === 0 || wd === 6) ? ' dayopt-we' : '') + '" type="button" ' +
      'data-act="day-pick" data-date="' + d + '"' + (on ? ' aria-pressed="true"' : '') + '>' +
      '<span class="dayopt-mark">' + I.check + '</span>' +
      '<span class="dayopt-date">' + esc(fmtShort(d)) + '</span>' +
      '<span class="dayopt-load">' + loadMeter(load, dayCapacity(d), true) + '</span></button>';
  }
  return out + '</div>';
}

/* --- exam form --- */
function leadPreviewText(dateStr, lead, topics) {
  if (!dateStr) return 'Zuerst ein Datum wählen.';
  if (lead < 1) return 'Kein Lernplan — du bekommst nur die Erinnerung am Vortag.';
  const start = addDays(dateStr, -lead);
  const head = 'Lernen ab <b>' + esc(fmtShort(start)) + '</b> · <b>' + lead +
    (lead === 1 ? ' Lerntag' : ' Lerntage') + '</b>';
  if (!topics || !topics.length) return head + ' · Stoff eintragen, dann wird er nach Umfang aufgeteilt';

  const plan = studyPlan({ date: dateStr, leadDays: lead, topics: topics });
  const rows = plan.slice(0, 3).map(p =>
    esc(fmtShort(p.date)) + ' &nbsp;' + esc(p.entries.length ? entryText(p.entries) : planLabel[p.kind]));
  return head + '<br>' + rows.join('<br>') + (plan.length > 3 ? '<br>…' : '');
}

  const prog = workProgress(h);
  const u = urgency(h.due, h.done);
  const done = h.workDone || {};

  let body = '<div class="det-hero" style="--sc:' + esc(s.color) + ';--p:' + (h.done ? 100 : prog.pct) + '">' +
    (plan.length || h.done
      ? '<span class="det-ring"><span>' + (h.done ? '✓' : prog.pct + '%') + '</span></span>'
      : '<span class="det-ring" style="--p:0"><span>' + I.book + '</span></span>') +
    '<div style="flex:1;min-width:0">' +
      '<div class="item-top"><span class="item-subject">' + esc(s.name) + '</span>' + urgPill(u) + '</div>' +
      '<div class="exam-title" style="font-size:17px;margin-top:3px">' + esc(h.title) + '</div>' +
    '</div></div>';

  body += '<div class="det-sec"><div class="det-meta">' +
    detRow('Fällig', h.due ? '<span class="num">' + esc(fmtLong(h.due)) + '</span> — ' + esc(relDay(h.due)) : 'ohne Datum') +
    detRow('Umfang', esc(WEIGHTS[w].label)) +
    (plan.length ? detRow('Plan', prog.done + ' von ' + prog.total + ' Arbeitstagen erledigt') : '') +
    (h.done && h.doneAt ? detRow('Erledigt', esc(fmtShort(h.doneAt))) : '') +
    '</div></div>';

  if (plan.length) {
    body += '<div class="det-sec"><div class="sec-head"><span class="sec-title">Arbeitsplan</span>' +
      '<span class="sec-count">' + prog.done + ' / ' + prog.total + '</span></div><div class="plan">';
    plan.forEach(p => {
      const isD = !!done[p.date];
      const cls = ['plan-row'];
      if (p.date === today()) cls.push('is-today');
      if (isD) cls.push('is-done');
      if (diffDays(today(), p.date) < 0) cls.push('is-past');
      body += '<div class="' + cls.join(' ') + '">' +
        '<button class="plan-check" type="button" data-act="work-toggle" data-id="' + esc(h.id) + '" data-date="' + esc(p.date) + '"' +
          ' aria-pressed="' + (isD ? 'true' : 'false') + '" aria-label="Arbeitstag erledigt">' + I.check + '</button>' +
        '<span class="plan-date">' + esc(fmtShort(p.date)) + '</span>' +
        '<span class="plan-topics">' + (p.entries.length ? esc(entryText(p.entries))
          : '<i>Teil ' + (p.idx + 1) + ' von ' + plan.length + '</i>') + '</span></div>';
    });
    body += '</div></div>';
  } else if (h.due && diffDays(today(), h.due) > 1 && !h.done) {
    body += '<div class="banner banner-info" style="margin-top:16px">' + I.info +
      '<span>Bis zur Abgabe sind es noch ' + diffDays(today(), h.due) + ' Tage. Beim Bearbeiten kannst du sie ' +
      'auf mehrere Tage aufteilen — die App sucht dir die freiesten heraus.</span></div>';
  }

  if (h.notes) body += '<div class="det-sec"><div class="sec-head"><span class="sec-title">Notiz</span></div>' +
    '<div class="det-note">' + esc(h.notes) + '</div></div>';

  openModal(modalHead('Hausübung', s.name) +
    '<div class="modal-body">' + body + '</div>' +
    '<div class="modal-foot">' +
      '<button class="btn btn-danger btn-icon-only" type="button" data-act="hw-del" data-id="' + esc(id) + '" aria-label="Löschen">' + I.trash + '</button>' +
      '<button class="btn" type="button" data-act="hw-edit" data-id="' + esc(id) + '">' + I.pencil + 'Bearbeiten</button>' +
      '<button class="btn btn-primary" type="button" data-act="hw-done-close" data-id="' + esc(id) + '">' +
        (h.done ? 'Wieder offen' : I.check + 'Erledigt') + '</button>' +
    '</div>', 'Hausübung', null, 'hw', id);
}

function saveHw(id) {
  const sid = $('#f-hw-subj').value;
  const title = $('#f-hw-title').value.trim();
  const due = $('#f-hw-due').value;
  const notes = $('#f-hw-notes').value.trim();
  const wb = $('#f-hw-weight [aria-pressed="true"]');
  const weight = wb ? +wb.dataset.w : 2;
  let split = $('#f-hw-split').getAttribute('aria-pressed') === 'true';
  if (!title) { toast('Was ist zu tun? Titel fehlt.', true); $('#f-hw-title').focus(); return; }

  const prev = id ? Store.homework[id] : null;
  const oldSteps = prev ? (prev.steps || []) : [];
  const ta = $('#f-hw-steps');
  const steps = split && ta
    ? ta.value.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 30).map(l => {
        const p = oldSteps.find(x => x && x.label === l);
        return { label: l, done: p ? !!p.done : false, w: weightOf({ w: WEIGHT_DRAFT.steps[l] || (p && p.w) }) };
      })
    : oldSteps;

  let workDates = split ? (State.draftDates || []).slice().sort() : [];
  if (split && !workDates.length) workDates = suggestWorkDates(due, defaultWorkDays(weight), id);
  if (split && !workDates.length) split = false;          // nothing left to spread over

  Store.put('homework', id || uid('hw'), {
    subjectId: sid, title: title, due: due || '', notes: notes,
    weight: weight, split: split, steps: steps, workDates: workDates,
    workDone: prev ? (prev.workDone || {}) : {},
    done: prev ? !!prev.done : false,
    doneAt: prev ? (prev.doneAt || null) : null,
    createdAt: prev ? prev.createdAt : today(),
  });
  State.draftDates = null;
  closeModal();
  toast(id ? 'Geändert.' : (split ? 'Eingetragen — auf ' + workDates.length + ' Tage verteilt.' : 'Eingetragen.'));
}

  const ics = buildICS();
  try {
    /* standalone app: use direct browser download */
    const blob = new Blob([ics.text], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'lernio.ics';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
    Store.saveSettings({ seq: (Math.round(Number(Store.settings.seq) || 0)) + 1 });
    toast('Datei geladen. Jetzt in den Kalender importieren.');
  } catch (err) {
    toast('Download nicht möglich — nimm den Text unten.', true);
    const d = $('#modal-root details'); if (d) d.open = true;
  }
}

async function doCopyIcs() {
  const ta = $('#ics-text'); if (!ta) return;
  let ok = false;
  try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) { ok = false; }
  if (!ok) {
    try { ta.focus(); ta.select(); ok = document.execCommand('copy'); } catch (e) { ok = false; }
  }
  toast(ok ? 'Kopiert.' : 'Konnte nicht kopieren — Text markieren und selbst kopieren.', !ok);
}

/* ============================================================
   19. THEME + PALETTE
   ============================================================ */
const THEME_KEY = 'schulmappe.theme';
const PALETTE_KEY = 'schulmappe.palette';
let themeMode = 'auto';                       // auto | light | dark
let currentPalette = 'teal';                  // teal | ocean | lavender | sunset | rose | forest
const THEME_LABEL = { auto: 'Folgt dem System', light: 'Immer hell', dark: 'Immer dunkel' };

const PALETTES = [
  { id: 'teal',     name: 'Teal',     dots: ['#0b6e6b', '#4ecdc4', '#d5ebe9'] },
  { id: 'ocean',    name: 'Ocean',    dots: ['#2563eb', '#60a5fa', '#dbeafe'] },
  { id: 'lavender', name: 'Lavendel', dots: ['#7c3aed', '#a78bfa', '#ede9fe'] },
  { id: 'sunset',   name: 'Sunset',   dots: ['#ea580c', '#fb923c', '#ffedd5'] },
  { id: 'rose',     name: 'Rosé',     dots: ['#e11d48', '#fb7185', '#ffe4e6'] },
  { id: 'forest',   name: 'Forest',   dots: ['#15803d', '#4ade80', '#dcfce7'] },
];

function applyPalette(id) {
  currentPalette = id;
  if (id === 'teal') document.documentElement.removeAttribute('data-palette');
  else document.documentElement.setAttribute('data-palette', id);
  try { localStorage.setItem(PALETTE_KEY, id); } catch (e) {}
  /* update meta theme-color to match the palette accent */
  const metaLight = document.querySelector('meta[name="theme-color"][media*="light"]');
  const metaDark  = document.querySelector('meta[name="theme-color"][media*="dark"]');
  const cs = getComputedStyle(document.documentElement);
  if (metaLight) metaLight.content = cs.getPropertyValue('--accent').trim();
  if (metaDark) metaDark.content = cs.getPropertyValue('--bg').trim();
}

function applyTheme(mode) {
  themeMode = mode;
  if (mode === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', mode);
  try { localStorage.setItem(THEME_KEY, mode); } catch (e) {}
  paintThemeIcon();
  /* refresh meta after theme change */
  requestAnimationFrame(() => {
    const cs = getComputedStyle(document.documentElement);
    const metaLight = document.querySelector('meta[name="theme-color"][media*="light"]');
    const metaDark  = document.querySelector('meta[name="theme-color"][media*="dark"]');
    if (metaLight) metaLight.content = cs.getPropertyValue('--accent').trim();
    if (metaDark) metaDark.content = cs.getPropertyValue('--bg').trim();
  });
}
function paintThemeIcon() {
  const icon = themeMode === 'auto' ? I.auto : themeMode === 'dark' ? I.moon : I.sun;
  ['#theme-toggle', '#theme-toggle-m'].forEach(s => {
    const el = $(s);
    if (el) { el.innerHTML = icon; el.title = THEME_LABEL[themeMode]; el.setAttribute('aria-label', THEME_LABEL[themeMode]); }
  });
}
function toggleTheme() {
  applyTheme(themeMode === 'auto' ? 'light' : themeMode === 'light' ? 'dark' : 'auto');
  toast(THEME_LABEL[themeMode]);
}

/* ============================================================
   20. EVENT WIRING
   ============================================================ */
document.addEventListener('click', ev => {
  const bd = ev.target.closest('.backdrop');
  if (bd && ev.target === bd) { closeModal(); return; }   // only the bare backdrop closes
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  const id = el.dataset.id;

  switch (a) {
    case 'go':
      State.view = el.dataset.view; render(); return;

    case 'modal-close':
      closeModal(); return;

    /* --- homework --- */
    case 'hw-toggle': {
      const h = Store.homework[id]; if (!h) return;
      Store.put('homework', id, Object.assign({}, h, { done: !h.done, doneAt: !h.done ? today() : null }));
      return;
    }
    case 'hw-edit': modalHw(id); return;
    case 'hw-detail': modalHwDetail(id); return;
    case 'ex-detail': modalExamDetail(id); return;
    case 'hw-done-close': {
      const h = Store.homework[id]; if (!h) return;
      Store.put('homework', id, Object.assign({}, h, { done: !h.done, doneAt: !h.done ? today() : null }));
      closeModal(); return;
    }
    case 'hw-del':
      closeModal(); deleteWithUndo('homework', id, 'Hausübung'); return;

    /* --- weights, splitting, day picking --- */
    case 'hw-weight': {
      $('#f-hw-weight').querySelectorAll('button').forEach(b => b.removeAttribute('aria-pressed'));
      el.setAttribute('aria-pressed', 'true');
      if ($('#f-hw-split').getAttribute('aria-pressed') === 'true') { autoPickDays(); refreshDayPicker(); }
      return;
    }
    case 'hw-split': {
      const on = el.getAttribute('aria-pressed') !== 'true';
      if (on) el.setAttribute('aria-pressed', 'true'); else el.removeAttribute('aria-pressed');
      $('#f-hw-splitbox').hidden = !on;
      if (on) {
        if (!(State.draftDates || []).length) autoPickDays();
        refreshDayPicker();
        renderStepWeights([]);
      }
      return;
    }
    case 'day-pick': {
      const d = el.dataset.date;
      const list = State.draftDates || (State.draftDates = []);
      const i = list.indexOf(d);
      if (i >= 0) list.splice(i, 1); else list.push(d);
      if (i >= 0) el.removeAttribute('aria-pressed'); else el.setAttribute('aria-pressed', 'true');
      updateDayNote();
      return;
    }
    case 'day-suggest': autoPickDays(); refreshDayPicker(); return;
    case 'stepw': {
      WEIGHT_DRAFT.steps[el.dataset.l] = +el.dataset.w;
      el.parentNode.querySelectorAll('button').forEach(b => b.removeAttribute('aria-pressed'));
      el.setAttribute('aria-pressed', 'true');
      return;
    }
    case 'topicw': {
      WEIGHT_DRAFT.topics[el.dataset.l] = +el.dataset.w;
      el.parentNode.querySelectorAll('button').forEach(b => b.removeAttribute('aria-pressed'));
      el.setAttribute('aria-pressed', 'true');
      updateLeadPreview();
      return;
    }
    case 'work-toggle': {
      const h = Store.homework[id]; if (!h) return;
      const d = el.dataset.date;
      const wd = Object.assign({}, h.workDone || {});
      if (wd[d]) delete wd[d]; else wd[d] = true;
      Store.put('homework', id, Object.assign({}, h, { workDone: wd }));
      refreshSheet();
      return;
    }
    case 'undo': {
      if (!undoState) return;
      const u = undoState; undoState = null;
      $('#toast-root').innerHTML = '';
      Store.put(u.coll, u.id, u.data);
      toast('Wieder da.');
      return;
    }
    case 'hw-filter': State.hwFilter = el.dataset.f; rerender(); return;
    case 'hw-subj': State.hwSubj = el.dataset.s || null; rerender(); return;

    /* --- appointments --- */
    case 'new-appt': modalAppt(null); return;
    case 'appt-edit': modalAppt(id); return;
    case 'appt-save': saveAppt(id || null); return;
    case 'appt-del': closeModal(); deleteWithUndo('appts', id, 'Termin'); return;
    case 'appt-kind': {
      $('#f-a-kinds').querySelectorAll('.kind').forEach(b => b.removeAttribute('aria-pressed'));
      el.setAttribute('aria-pressed', 'true');
      $('#f-a-timebox').hidden = el.dataset.k === 'frei';
      updateApptNote();
      return;
    }
    case 'appt-repeat': {
      $('#f-a-repeat').querySelectorAll('button').forEach(b => b.removeAttribute('aria-pressed'));
      el.setAttribute('aria-pressed', 'true');
      const weekly = el.dataset.r === 'weekly';
      $('#f-a-wdbox').hidden = !weekly;
      $('#f-a-datebox').hidden = weekly;
      return;
    }
    case 'appt-wd': {
      if (el.getAttribute('aria-pressed') === 'true') el.removeAttribute('aria-pressed');
      else el.setAttribute('aria-pressed', 'true');
      return;
    }
    case 'sched': {
      const sched = Object.assign({}, Store.settings.schedule || DEFAULTS.schedule);
      sched[el.dataset.w] = +el.dataset.h;
      Store.saveSettings({ schedule: sched });
      return;
    }
    case 'hw-quick': {
      const inp = $('#f-hw-due'); if (inp) inp.value = addDays(today(), +el.dataset.d);
      $('#modal-root').querySelectorAll('[data-act="hw-quick"]').forEach(b => b.removeAttribute('aria-pressed'));
      el.setAttribute('aria-pressed', 'true');
      return;
    }
    case 'hw-save': saveHw(id || null); return;
    case 'new-hw': modalHw(null, el.dataset.date); return;

    /* --- exams --- */
    case 'new-ex': modalExam(null); return;
    case 'ex-edit': modalExam(id); return;
    case 'ex-save': saveExam(id || null); return;
    case 'ex-del':
      closeModal(); deleteWithUndo('exams', id, 'Test'); return;
    case 'ex-expand':
      State.openExams[id] = !State.openExams[id]; rerender(); return;
    case 'ex-grade': modalGrade(id); return;
    case 'grade-set': {
      const e = Store.exams[id]; if (!e) return;
      Store.put('exams', id, Object.assign({}, e, { grade: el.dataset.g || '' }));
      closeModal(); return;
    }
    case 'kind-pick': {
      $('#f-ex-kinds').querySelectorAll('.kind').forEach(b => b.removeAttribute('aria-pressed'));
      el.setAttribute('aria-pressed', 'true');
      const k = KINDS[el.dataset.k];
      const r = $('#f-ex-lead');
      if (r && k) { r.value = k.lead; updateLeadPreview(); }
      return;
    }
    case 'study-toggle': {
      const e = Store.exams[id]; if (!e) return;
      const d = el.dataset.date;
      const sd = Object.assign({}, e.studyDone || {});
      if (sd[d]) delete sd[d]; else sd[d] = true;
      Store.put('exams', id, Object.assign({}, e, { studyDone: sd }));
      refreshSheet();
      return;
    }
    case 'topic-toggle': {
      const e = Store.exams[id]; if (!e) return;
      const i = +el.dataset.i;
      const tp = (e.topics || []).map((t, j) =>
        j === i ? { label: t.label, done: !t.done, w: weightOf(t) } : t);
      Store.put('exams', id, Object.assign({}, e, { topics: tp }));
      refreshSheet();
      return;
    }

    /* --- calendar --- */
    case 'cal-prev': case 'cal-next': {
      const p = State.calMonth.split('-');
      const d = new Date(+p[0], +p[1] - 1 + (a === 'cal-next' ? 1 : -1), 1);
      State.calMonth = d.getFullYear() + '-' + pad2(d.getMonth() + 1);
      rerender(); return;
    }
    case 'cal-today':
      State.calMonth = today().slice(0, 7); State.calSel = today(); rerender(); return;
    case 'cal-pick':
      State.calSel = el.dataset.date;
      if (el.dataset.date.slice(0, 7) !== State.calMonth) State.calMonth = el.dataset.date.slice(0, 7);
      rerender(); return;
    case 'cal-mode':
      State.calMode = el.dataset.m; rerender(); return;
    case 'cal-jump':
      State.calSel = el.dataset.date;
      State.calMonth = el.dataset.date.slice(0, 7);
      State.view = 'kalender'; render(); return;
    case 'go-load':
      State.calMode = 'load'; State.view = 'kalender'; render(); return;

    /* --- subjects --- */
    case 'new-subject': modalSubject(null); return;
    case 'subj-edit': modalSubject(id); return;
    case 'subj-save': saveSubject(id || null); return;
    case 'subj-del': {
      const used = Store.list('homework').filter(h => h.subjectId === id).length +
                   Store.list('exams').filter(e => e.subjectId === id).length;
      if (used) { toast('Das Fach hat noch ' + used + ' Einträge. Erst die löschen.', true); return; }
      closeModal(); deleteWithUndo('subjects', id, 'Fach'); return;
    }
    case 'swatch':
      $('#f-s-colors').querySelectorAll('.swatch').forEach(b => b.removeAttribute('aria-pressed'));
      el.setAttribute('aria-pressed', 'true'); return;

    /* --- onboarding --- */
    case 'seed-toggle': {
      const i = el.dataset.i;
      State.seedSel[i] = !State.seedSel[i];
      rerender(); return;
    }
    case 'seed-custom':
      openModal(modalHead('Eigenes Fach') +
        '<div class="modal-body"><div class="field"><label class="label" for="f-seed-name">Wie heißt es?</label>' +
        '<input class="input" id="f-seed-name" type="text" maxlength="40" placeholder="z.B. Konstruktionsübungen"></div></div>' +
        '<div class="modal-foot"><button class="btn" type="button" data-act="modal-close">Abbrechen</button>' +
        '<button class="btn btn-primary" type="button" data-act="seed-add">Hinzufügen</button></div>', 'Eigenes Fach');
      return;
    case 'seed-add': {
      const n = $('#f-seed-name').value.trim();
      if (!n) { toast('Name fehlt.', true); $('#f-seed-name').focus(); return; }
      State.seedExtra.push([n, n.slice(0, 3).toUpperCase()]);
      State.seedSel[SEED_SUBJECTS.length + State.seedExtra.length - 1] = true;
      closeModal(); rerender();
      return;
    }
    case 'seed-create': {
      const all = SEED_SUBJECTS.concat(State.seedExtra);
      const picks = Object.keys(State.seedSel).filter(k => State.seedSel[k]).map(Number).sort((x, y) => x - y);
      if (!picks.length) return;
      picks.forEach(i => {
        const s = all[i]; if (!s) return;
        Store.put('subjects', uid('s'), {
          name: s[0], short: s[1], color: PALETTE[i % PALETTE.length], createdAt: today(),
        });
      });
      State.seedSel = {}; State.seedExtra = [];
      toast(picks.length + ' Fächer angelegt. Jetzt eintragen.');
      return;
    }

    /* --- settings / export --- */
    case 'export-open': modalExport(); return;
    case 'export-zip': doExportZip(); return;
    case 'export-copy': doCopyIcs(); return;
    case 'toggle-hwrem':
      Store.saveSettings({ hwReminder: !Store.settings.hwReminder }); return;

    /* --- WebUntis Schulsuche --- */
    case 'untis-preset-htlvi': {
      const sv = document.getElementById('untis-server');
      const sc = document.getElementById('untis-school');
      /* HTL Villach hat eine eigene WebUntis-Subdomain; der interne
         Schulname ist htblva_villach (steht auf der IT-Services-Seite). */
      if (sv) sv.value = 'htl-villach.webuntis.com';
      if (sc) sc.value = 'htblva_villach';
      const cfg = loadUntisConfig();
      cfg.server = 'htl-villach.webuntis.com';
      cfg.school = 'htblva_villach';
      saveUntisConfig(cfg);
      const results = document.getElementById('untis-search-results');
      if (results) results.innerHTML = '<div style="font-size:12.5px;color:var(--ok);padding:4px 0">✓ HTL Villach eingetragen. Jetzt Login-Daten unten eingeben und "Ferien laden" drücken.</div>';
      return;
    }
    case 'untis-school-search': {
      const q = (document.getElementById('untis-search') || {}).value || '';
      const results = document.getElementById('untis-search-results');
      if (!q.trim()) {
        if (results) results.innerHTML = '<div style="font-size:12.5px;color:var(--ink-3);padding:4px 0">Bitte Schulnamen eingeben.</div>';
        return;
      }
      if (results) results.innerHTML = '<div style="font-size:12.5px;color:var(--ink-3);padding:4px 0">Suche läuft…</div>';
      el.disabled = true;
      untisSearchSchool(q.trim()).then(list => {
        el.disabled = false;
        if (!list.length) {
          results.innerHTML = '<div style="font-size:12.5px;color:var(--ink-3);padding:4px 0">Keine Schule gefunden.</div>';
          return;
        }
        results.innerHTML = list.slice(0, 8).map((s, i) =>
          '<button type="button" class="btn btn-sm" data-act="untis-pick-school" data-i="' + i + '" ' +
          'style="display:block;width:100%;text-align:left;margin-bottom:6px;white-space:normal;line-height:1.35">' +
          '<strong>' + esc(s.displayName) + '</strong>' +
          '<div style="font-size:11.5px;color:var(--ink-3);margin-top:2px">' + esc(s.address || s.server) + '</div>' +
          '</button>'
        ).join('');
        /* Liste im Speicher parken für die Auswahl */
        window._untisSearchList = list;
      }).catch(err => {
        el.disabled = false;
        if (results) results.innerHTML = '<div style="font-size:12.5px;color:var(--danger);padding:4px 0">Suche fehlgeschlagen: ' + esc(err.message || 'unbekannt') + '</div>';
      });
      return;
    }
    case 'untis-pick-school': {
      const i = parseInt(el.getAttribute('data-i'), 10);
      const list = window._untisSearchList || [];
      const s = list[i];
      if (!s) return;
      const sv = document.getElementById('untis-server');
      const sc = document.getElementById('untis-school');
      if (sv) sv.value = s.server;
      if (sc) sc.value = s.loginName;
      const cfg = loadUntisConfig();
      cfg.server = s.server; cfg.school = s.loginName;
      saveUntisConfig(cfg);
      const results = document.getElementById('untis-search-results');
      if (results) results.innerHTML = '<div style="font-size:12.5px;color:var(--ok);padding:4px 0">✓ ' + esc(s.displayName) + ' übernommen — jetzt Login-Daten eingeben und "Ferien laden" drücken.</div>';
      return;
    }

    /* --- design / palette --- */
    case 'untis-sync': {
      /* Untis-Credentials aus den Feldern lesen und speichern */
      const cfg = loadUntisConfig();
      const sv = document.getElementById('untis-server');
      const sc = document.getElementById('untis-school');
      const su = document.getElementById('untis-user');
      const sp = document.getElementById('untis-pass');
      if (sv) cfg.server = sv.value.trim();
      if (sc) cfg.school = sc.value.trim();
      if (su) cfg.user = su.value.trim();
      if (sp) cfg.pass = sp.value;
      saveUntisConfig(cfg);
      const status = document.getElementById('untis-status');
      if (status) { status.style.color = 'var(--ink-3)'; status.textContent = 'Verbinde…'; }
      el.disabled = true;
      syncUntisHolidays().then(h => {
        _holidayMaps = {}; // Cache zurücksetzen
        toast(h.length + ' Ferien von Untis geladen');
        rerender();
      }).catch(err => {
        console.error('Untis sync failed:', err);
        let msg = err.message || 'Verbindung fehlgeschlagen';
        const low = msg.toLowerCase();
        if (low.includes('networkerror') || low.includes('failed to fetch') || low.includes('alle proxies')) {
          msg = 'Verbindung fehlgeschlagen — alle CORS-Proxies down oder Servername falsch. Nutze "Schule suchen".';
        } else if (low.includes('bad credentials') || low.includes('wrong') || low.includes('no user')) {
          msg = 'Falscher Username oder Passwort.';
        } else if (low.includes('too many')) {
          msg = 'Zu viele Anmeldeversuche — bitte ein paar Minuten warten.';
        } else if (low.includes('not authenticated')) {
          msg = 'Sitzung abgelaufen — bitte nochmal versuchen.';
        } else if (low.includes('http 404')) {
          msg = 'Server unbekannt (404) — prüfe den Servernamen oder nutze "Schule suchen".';
        }
        if (status) { status.style.color = 'var(--danger)'; status.textContent = 'Fehler: ' + msg; }
        /* Server-Feld aktualisieren falls bereinigt */
        if (sv) { const c = loadUntisConfig(); sv.value = c.server || ''; }
        el.disabled = false;
      });
      return;
    }
    case 'set-palette': {
      applyPalette(el.dataset.pid);
      toast(PALETTES.find(p => p.id === el.dataset.pid)?.name || el.dataset.pid);
      rerender();
      return;
    }
    case 'set-mode': {
      applyTheme(el.dataset.mode);
      toast(THEME_LABEL[el.dataset.mode]);
      rerender();
      return;
    }
  }
});

/* range + text inputs */
let weightTimer = null;
document.addEventListener('input', ev => {
  const a = ev.target.dataset && ev.target.dataset.act;
  if (a === 'lead-input') updateLeadPreview();
  if (a === 'topics-input') {
    updateLeadPreview();
    clearTimeout(weightTimer);
    weightTimer = setTimeout(() => { renderTopicWeights(null); updateLeadPreview(); }, 500);
  }
  if (a === 'steps-input') {
    clearTimeout(weightTimer);
    weightTimer = setTimeout(() => renderStepWeights(null), 500);
  }
});
document.addEventListener('change', ev => {
  const a = ev.target.dataset && ev.target.dataset.act;
  if (a === 'set-time') {
    const v = ev.target.value || '16:00';
    Store.saveSettings({ reminderTime: v });
    toast('Erinnerung um ' + v + '. Kalenderdatei neu laden, damit es wirkt.');
  }
  if (a === 'set-class') Store.saveSettings({ className: ev.target.value.trim() });
});

document.addEventListener('keydown', ev => {
  /* rows that behave as buttons should answer the keyboard too */
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target && ev.target.matches &&
      ev.target.matches('[role="button"][data-act]')) {
    ev.preventDefault(); ev.target.click(); return;
  }
  if (ev.key === 'Escape' && $('#modal-root').firstChild) { closeModal(); return; }
  if (ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) {
    const s = $('#modal-root [data-act$="-save"]');
    if (s) { s.click(); ev.preventDefault(); }
  }
});

$('#fab').addEventListener('click', () => {
  if (!subjectsSorted().length) { toast('Zuerst deine Fächer anlegen.', true); return; }
  modalPick();
});
$('#theme-toggle').addEventListener('click', toggleTheme);
$('#theme-toggle-m').addEventListener('click', toggleTheme);

/* ============================================================
   21. BOOT
   ============================================================ */
(function boot() {
  let t = null, p = null;
  try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
  try { p = localStorage.getItem(PALETTE_KEY); } catch (e) {}
  const validPalettes = PALETTES.map(x => x.id);
  if (p && validPalettes.includes(p)) applyPalette(p);
  applyTheme(t === 'dark' || t === 'light' ? t : 'auto');

  render();
  Store.onChange(() => { rerender(); updateFab(); });
  Store.init().then(() => { render(); updateFab(); });

  /* a day can roll over while the tab stays open */
  let lastDay = today();
  setInterval(() => {
    if (today() !== lastDay) { lastDay = today(); render(); }
  }, 60000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && today() !== lastDay) { lastDay = today(); render(); }
  });

  /* register service worker for PWA / offline */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();

function updateFab() {
  const f = $('#fab');
  if (f) f.hidden = !Store.ready || !subjectsSorted().length;
}
